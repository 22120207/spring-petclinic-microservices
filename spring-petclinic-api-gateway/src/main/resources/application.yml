spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://spring-petclinic-config-server-service:8888}
  cloud:
    gateway:
      default-filters:
        - name: CircuitBreaker
          args:
            name: defaultCircuitBreaker
            fallbackUri: forward:/fallback
        - name: Retry
          args:
            retries: 1
            statuses: SERVICE_UNAVAILABLE
            methods: POST
      routes:
        - id: vets-service
          uri: ${VETS_SERVICE_URI:http://spring-petclinic-vets-service-service:8083}
          predicates:
            - Path=/api/vet/**
          filters:
            - StripPrefix=2
        - id: visits-service
          uri: ${VISITS_SERVICE_URI:http://spring-petclinic-visits-service-service"":8082}
          predicates:
            - Path=/api/visit/**
          filters:
            - StripPrefix=2
        - id: customers-service
          uri: ${CUSTOMERS_SERVICE_URI:http://spring-petclinic-customers-service-service:8081}
          predicates:
            - Path=/api/customer/**
          filters:
            - StripPrefix=2
        - id: genai-service
          uri: ${GENAI_SERVICE_URI:http://spring-petclinic-genai-service-service:8084}
          predicates:
            - Path=/api/genai/**
          filters:
            - StripPrefix=2
            - CircuitBreaker=name=genaiCircuitBreaker,fallbackUri=/fallback

---
spring:
  config:
    activate:
      on-profile: docker
    import: optional:configserver:${CONFIG_SERVER_URL:http://spring-petclinic-config-server-service:8888}

petclinic:
  customer-service:
    url: ${CUSTOMERS_SERVICE_INTERNAL_URL:http://spring-petclinic-customers-service-service:8081}
  visits-service:
    url: ${VISITS_SERVICE_INTERNAL_URL:http://spring-petclinic-visits-service-service:8082}